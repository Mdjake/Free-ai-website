<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saif AI</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    header {
        text-align: center;
        padding: 15px;
        background: rgba(0,0,0,0.3);
        font-size: 20px;
        font-weight: bold;
    }

    header span {
        color: #38bdf8;
    }

    #chat {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
    }

    .msg {
        margin: 10px 0;
        padding: 10px 15px;
        border-radius: 12px;
        max-width: 70%;
    }

    .user {
        background: #38bdf8;
        color: black;
        margin-left: auto;
    }

    .bot {
        background: #1e293b;
        border: 1px solid #38bdf8;
    }

    #inputBox {
        display: flex;
        padding: 10px;
        background: rgba(0,0,0,0.3);
    }

    input {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 8px;
        outline: none;
    }

    button {
        margin-left: 10px;
        padding: 10px 15px;
        border: none;
        background: #38bdf8;
        color: black;
        border-radius: 8px;
        cursor: pointer;
    }

    button:hover {
        background: #0ea5e9;
    }
</style>
</head>

<body>

<header>
    🤖 <span>Saif AI</span> | Fine-Tuned Assistant
</header>

<div id="chat"></div>

<div id="inputBox">
    <input type="text" id="userInput" placeholder="Ask anything..." />
    <button onclick="sendMessage()">Send</button>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById("userInput");
    const chat = document.getElementById("chat");

    const text = input.value.trim();
    if (!text) return;

    // Add user message
    chat.innerHTML += `<div class="msg user">${text}</div>`;
    input.value = "";

    // Scroll down
    chat.scrollTop = chat.scrollHeight;

    try {
        const res = await fetch(`https://samba-api-free.onrender.com/?query=${encodeURIComponent(text)}`);
        const data = await res.json();

        const reply = data.message || "No response from AI";

        chat.innerHTML += `<div class="msg bot">${reply}</div>`;
        chat.scrollTop = chat.scrollHeight;

    } catch (err) {
        chat.innerHTML += `<div class="msg bot">Error connecting to AI</div>`;
    }
}
</script>

</body>
</html>
