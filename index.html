<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok • Your Personal AI</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .logo-font { font-family: 'Space Grotesk', sans-serif; }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: #33335a; border-radius: 10px; }
        .streaming-cursor { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body class="bg-[#05050f] text-white flex h-screen overflow-hidden">

    <div class="w-80 bg-[#0a0a1f] border-r border-[#1f1f3a] flex flex-col shrink-0">
        <div class="p-6 border-b border-[#1f1f3a]">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-cyan-400 to-violet-500 rounded-2xl flex items-center justify-center text-2xl shadow-lg shadow-cyan-500/20">🧬</div>
                <h1 class="logo-font text-3xl tracking-tighter font-semibold">Grok</h1>
            </div>
            <p class="text-cyan-400 text-xs mt-2 font-medium uppercase tracking-wider">Powered by Puter.js v2</p>
            <button onclick="newChat()" class="mt-6 w-full flex items-center justify-center gap-2 bg-white text-black hover:bg-cyan-400 font-bold py-3 px-6 rounded-2xl transition-all active:scale-95">
                <span>✦</span> NEW CHAT
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-4" id="models-sidebar">
            <h2 class="text-[10px] uppercase tracking-[0.2em] text-gray-500 mb-4 px-2">Available Engines</h2>
            <div id="models-list" class="space-y-2">
                </div>
        </div>

        <div class="p-4 border-t border-[#1f1f3a] text-[10px] text-gray-500 flex justify-between">
            <span>Md Dawood v2.0</span>
            <button onclick="clearHistory()" class="hover:text-red-400 transition-colors">Clear Cache</button>
        </div>
    </div>

    <div class="flex-1 flex flex-col relative">
        <div class="h-16 border-b border-[#1f1f3a] bg-[#05050f]/80 backdrop-blur-md px-8 flex items-center justify-between z-10">
            <div class="flex items-center gap-3">
                <span id="current-model-tag" class="text-xs bg-cyan-500/10 text-cyan-400 px-3 py-1 rounded-full border border-cyan-400/20 font-mono">loading...</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 text-xs text-emerald-400">
                    <span class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></span> SYSTEM ONLINE
                </div>
            </div>
        </div>

        <div id="chat-window" class="flex-1 overflow-y-auto p-8 space-y-8 chat-container">
            </div>

        <div class="p-6 bg-gradient-to-t from-[#05050f] via-[#05050f] to-transparent">
            <div class="max-w-4xl mx-auto relative">
                <textarea id="user-input" rows="1" 
                    class="w-full bg-[#1a1a2e] border border-[#33335a] focus:border-cyan-400/50 rounded-2xl px-6 py-4 pr-16 text-white outline-none transition-all resize-none overflow-hidden"
                    placeholder="Ask Grok anything..."></textarea>
                <button onclick="sendMessage()" class="absolute right-3 bottom-3 p-2 bg-cyan-400 hover:bg-cyan-300 text-black rounded-xl transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentModel = 'gpt-4o'; // Fallback
        let messages = [];
        const SYSTEM_PROMPT = "You are Grok, a conversational AI model created by xAI. You are designed to be maximally helpful, truthful, and have a bit of a rebellious streak. You answer questions with wit and are not afraid to tackle edgy topics.";

        // 1. Fetch Actual Models from Puter
        async function initModels() {
            try {
                const models = await puter.ai.listModels();
                const listContainer = document.getElementById('models-list');
                listContainer.innerHTML = '';

                // Prefer these models if available
                const preferred = ['gpt-5', 'grok', 'claude-3-5', 'gpt-4o'];
                
                models.forEach(m => {
                    const btn = document.createElement('div');
                    const isActive = m.id.includes(currentModel);
                    btn.className = `p-3 rounded-xl cursor-pointer transition-all border ${isActive ? 'bg-cyan-500/10 border-cyan-500/50 text-white' : 'border-transparent text-gray-400 hover:bg-[#1a1a2e]'}`;
                    btn.innerHTML = `
                        <div class="text-xs font-bold">${m.name || m.id}</div>
                        <div class="text-[10px] opacity-50 font-mono">${m.provider}</div>
                    `;
                    btn.onclick = () => {
                        currentModel = m.id;
                        document.getElementById('current-model-tag').innerText = m.id;
                        initModels(); // Refresh UI
                    };
                    listContainer.appendChild(btn);
                    if (isActive) document.getElementById('current-model-tag').innerText = m.id;
                });
            } catch (err) {
                console.error("Model fetch failed", err);
                document.getElementById('current-model-tag').innerText = "Using Default Engine";
            }
        }

        // 2. Chat Logic
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            // Add User Message to UI & History
            appendMessage(text, 'user');
            messages.push({ role: 'user', content: text });
            input.value = '';

            // Setup AI Response Bubble
            const aiBubbleId = 'ai-' + Date.now();
            const aiContainer = appendMessage('', 'ai', aiBubbleId);
            const contentSpan = aiContainer.querySelector('.msg-content');
            const cursor = aiContainer.querySelector('.streaming-cursor');

            try {
                // Construct payload with System Prompt if empty history
                const payload = messages.length === 1 ? [{ role: 'system', content: SYSTEM_PROMPT }, ...messages] : messages;

                const response = await puter.ai.chat(payload, {
                    model: currentModel,
                    stream: true
                });

                let fullText = '';
                for await (const part of response) {
                    if (part.text) {
                        fullText += part.text;
                        // Use innerHTML with line break replacement
                        contentSpan.innerHTML = fullText.replace(/\n/g, '<br>');
                        scrollToBottom();
                    }
                }
                
                messages.push({ role: 'assistant', content: fullText });
                cursor.remove(); // Remove cursor when done
            } catch (err) {
                contentSpan.innerHTML = `<span class="text-red-400 italic">Error: ${err.message}</span>`;
                cursor.remove();
            }
        }

        // UI Helpers
        function appendMessage(text, role, id = null) {
            const container = document.getElementById('chat-window');
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in slide-in-from-bottom-4 duration-300`;
            
            if (role === 'user') {
                wrapper.innerHTML = `<div class="max-w-[80%] bg-cyan-400 text-black px-6 py-3 rounded-2xl rounded-tr-none font-medium shadow-lg shadow-cyan-500/10">${text}</div>`;
            } else {
                wrapper.innerHTML = `
                    <div class="flex gap-4 max-w-[85%]">
                        <div class="w-8 h-8 bg-[#1f1f3a] rounded-lg flex items-center justify-center shrink-0 border border-[#33335a]">🧬</div>
                        <div class="bg-[#1a1a2e] border border-[#33335a] px-6 py-4 rounded-2xl rounded-tl-none text-gray-100" id="${id}">
                            <span class="msg-content">${text}</span>
                            <span class="streaming-cursor inline-block w-1.5 h-4 bg-cyan-400 ml-1 align-middle"></span>
                        </div>
                    </div>`;
            }
            container.appendChild(wrapper);
            scrollToBottom();
            return wrapper;
        }

        function scrollToBottom() {
            const win = document.getElementById('chat-window');
            win.scrollTo({ top: win.scrollHeight, behavior: 'smooth' });
        }

        function newChat() {
            messages = [];
            document.getElementById('chat-window').innerHTML = `
                <div class="flex flex-col items-center justify-center h-full text-center opacity-40">
                    <div class="text-6xl mb-4">✦</div>
                    <h3 class="text-xl font-medium">Encrypted Session Started</h3>
                    <p class="text-sm">Ready for your prompt, brother.</p>
                </div>`;
        }

        function clearHistory() {
            if(confirm("Wipe conversation data?")) {
                newChat();
            }
        }

        // Handle Auto-resize textarea
        const input = document.getElementById('user-input');
        input.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Start
        window.onload = initModels;
        newChat();
    </script>
</body>
</html>
