<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nano Banana 2 — Image Generator</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.8rem;
            background: linear-gradient(90deg, #ffcc00, #ff6600);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }
        .subtitle {
            color: #888;
            font-size: 1.1rem;
        }
        
        .control-panel {
            background: #111;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
        
        .prompt-box {
            width: 100%;
            min-height: 120px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 15px;
            color: #fff;
            font-size: 1.05rem;
            resize: vertical;
            outline: none;
            margin-bottom: 15px;
            font-family: inherit;
        }
        .prompt-box:focus {
            border-color: #ffcc00;
        }
        
        .options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        select, button {
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
        }
        
        select {
            background: #1a1a1a;
            color: #fff;
            min-width: 220px;
        }
        
        .generate-btn {
            background: linear-gradient(90deg, #ffcc00, #ff8800);
            color: #000;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 14px 40px;
            transition: all 0.3s;
        }
        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 204, 0, 0.4);
        }
        
        .result-area {
            background: #111;
            border-radius: 16px;
            padding: 20px;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .generated-image {
            max-width: 100%;
            max-height: 600px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        
        .loading {
            color: #ffcc00;
            font-size: 1.3rem;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        
        .history {
            margin-top: 40px;
        }
        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }
        .history-item {
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .history-item:hover {
            transform: scale(1.05);
        }
        .history-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        
        .actions {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
        }
        .action-btn {
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Nano Banana 2</h1>
            <p class="subtitle">Ultra-fast AI Image Generator • Powered by Puter + Gemini</p>
        </header>

        <div class="control-panel">
            <textarea id="promptInput" class="prompt-box" placeholder="Describe the image you want... (e.g. cyberpunk Tokyo street at night, neon lights, raining)"></textarea>
            
            <div class="options">
                <select id="modelSelect">
                    <option value="gemini-3.1-flash-image-preview">Gemini 3.1 Flash (Fast)</option>
                    <option value="gemini-2.0-flash-exp">Gemini 2.0 Flash Exp</option>
                    <option value="gemini-1.5-pro">Gemini 1.5 Pro (Better quality)</option>
                </select>
                
                <button id="generateBtn" class="generate-btn">🚀 Generate Image</button>
            </div>
        </div>

        <div class="result-area" id="resultArea">
            <div id="placeholder">Your generated image will appear here</div>
            <div id="imageContainer" style="display:none; width:100%; text-align:center;"></div>
        </div>

        <div class="history">
            <h2>Generation History</h2>
            <div id="historyGrid" class="history-grid"></div>
        </div>
    </div>

    <script>
        let historyImages = [];

        const promptInput = document.getElementById('promptInput');
        const modelSelect = document.getElementById('modelSelect');
        const generateBtn = document.getElementById('generateBtn');
        const resultArea = document.getElementById('resultArea');
        const imageContainer = document.getElementById('imageContainer');
        const placeholder = document.getElementById('placeholder');
        const historyGrid = document.getElementById('historyGrid');

        async function generateImage() {
            const prompt = promptInput.value.trim();
            if (!prompt) {
                alert("Please enter a prompt!");
                return;
            }

            // UI feedback
            generateBtn.disabled = true;
            generateBtn.textContent = "Generating...";
            placeholder.style.display = "none";
            imageContainer.style.display = "none";
            imageContainer.innerHTML = `<div class="loading">🔄 Generating with ${modelSelect.value}...</div>`;

            try {
                const imageElement = await puter.ai.txt2img(prompt, {
                    model: modelSelect.value
                });

                // Clear previous
                imageContainer.innerHTML = '';
                imageContainer.appendChild(imageElement);
                imageElement.classList.add('generated-image');

                imageContainer.style.display = "block";

                // Add to history
                addToHistory(prompt, imageElement.src);

                // Action buttons
                const actions = document.createElement('div');
                actions.className = 'actions';
                actions.innerHTML = `
                    <button class="action-btn" onclick="copyImage('${imageElement.src}')">📋 Copy</button>
                    <button class="action-btn" onclick="downloadImage('\( {imageElement.src}', ' \){prompt}')">⬇️ Save</button>
                `;
                imageContainer.appendChild(actions);

            } catch (error) {
                imageContainer.innerHTML = `<p style="color:#ff4444;">Generation failed. Try again.</p>`;
                console.error(error);
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = "🚀 Generate Image";
            }
        }

        function addToHistory(prompt, imgSrc) {
            historyImages.unshift({ prompt, imgSrc });
            if (historyImages.length > 12) historyImages.pop();

            historyGrid.innerHTML = '';
            historyImages.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <img src="\( {item.imgSrc}" alt=" \){item.prompt}">
                    <div style="padding:8px; background:#1a1a1a; font-size:0.8rem; color:#ccc;">${item.prompt.substring(0, 45)}...</div>
                `;
                div.onclick = () => {
                    promptInput.value = item.prompt;
                    imageContainer.innerHTML = `<img src="${item.imgSrc}" class="generated-image">`;
                    imageContainer.style.display = "block";
                    placeholder.style.display = "none";
                };
                historyGrid.appendChild(div);
            });
        }

        function copyImage(src) {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = src;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                canvas.getContext('2d').drawImage(img, 0, 0);
                canvas.toBlob(blob => {
                    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                    alert("Image copied to clipboard!");
                });
            };
        }

        function downloadImage(src, prompt) {
            const a = document.createElement('a');
            a.href = src;
            a.download = `nanobana2_${prompt.substring(0, 30).replace(/[^a-z0-9]/gi, '_')}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Enter key support
        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateImage();
            }
        });

        generateBtn.addEventListener('click', generateImage);

        // Demo image on load
        window.onload = () => {
            promptInput.value = "A serene Japanese garden with cherry blossoms at sunset, cinematic lighting";
            // You can call generateImage() automatically if you want
        };
    </script>
</body>
</html>
