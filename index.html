<!DOCTYPE html>
<html>
<head>
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>
  <script>
    async function generateNanoBanana() {
      const prompt = "A realistic Kolkata street vendor selling hot biryani with a futuristic nano banana floating above, 4K, cinematic lighting";
      
      const response = await puter.ai.image({
        model: "gemini-3.1-flash-image",   // or "gemini-3-pro-image" / "gemini-2.5-flash-image"
        prompt: prompt,
        width: 1024,
        height: 1024,
        // steps: 30, quality: "high"  // add more params if needed
      });

      // Display the image
      const img = document.createElement('img');
      img.src = response.url;   // or response.data if base64
      document.body.appendChild(img);
      
      console.log("✅ Nano Banana image generated:", response.url);
    }

    generateNanoBanana();
  </script>
</body>
</html>
