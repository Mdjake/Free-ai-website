<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <title>PuterChat — Free AI</title>
  <script src="https://js.puter.com/v2/"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0c0c0f;
      --surface:  #131318;
      --surf2:    #1c1c24;
      --border:   #2a2a38;
      --border2:  #3a3a50;
      --text:     #e8e8f0;
      --muted:    #6b6b8a;
      --accent:   #7c6ff7;
      --accent2:  #a89cff;
      --green:    #4ade80;
      --red:      #f87171;
      --mono:     'JetBrains Mono', monospace;
      --sans:     'Instrument Sans', sans-serif;
      --display:  'Syne', sans-serif;
    }

    html { height: 100%; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100dvh;
      height: 100vh;
      overflow: hidden;
    }

    /* ═══════════════ SIDEBAR ═══════════════ */
    #sidebar {
      width: 270px; min-width: 270px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
      transition: transform 0.25s ease;
      z-index: 20;
    }

    .sidebar-top {
      padding: 20px 16px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .wordmark {
      display: flex; align-items: center; gap: 9px; margin-bottom: 14px;
    }
    .wordmark-icon {
      width: 34px; height: 34px; background: var(--accent);
      border-radius: 9px; display: flex; align-items: center;
      justify-content: center; font-size: 17px; flex-shrink: 0;
    }
    .wordmark h1 {
      font-family: var(--display); font-size: 19px; font-weight: 700;
      letter-spacing: -0.4px;
    }
    .wordmark-badge {
      font-family: var(--mono); font-size: 9px; color: var(--accent2);
      background: rgba(124,111,247,0.12);
      border: 1px solid rgba(124,111,247,0.25);
      padding: 2px 7px; border-radius: 20px; white-space: nowrap;
    }

    #new-chat-btn {
      width: 100%; padding: 10px 14px;
      background: var(--accent); color: #fff;
      font-family: var(--sans); font-size: 13px; font-weight: 600;
      border: none; border-radius: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      transition: background 0.15s, transform 0.1s;
    }
    #new-chat-btn:hover  { background: #6a5ef0; }
    #new-chat-btn:active { transform: scale(0.98); }

    .section-label {
      font-family: var(--mono); font-size: 9px; font-weight: 500;
      letter-spacing: 1.4px; color: var(--muted); text-transform: uppercase;
      padding: 14px 16px 7px;
    }

    #current-model-btn {
      margin: 0 10px; padding: 11px 13px;
      background: var(--surf2); border: 1px solid var(--border);
      border-radius: 12px; cursor: pointer;
      display: flex; align-items: center; gap: 9px;
      transition: border-color 0.15s, background 0.15s;
      text-align: left; width: calc(100% - 20px);
    }
    #current-model-btn:hover {
      border-color: var(--accent); background: rgba(124,111,247,0.07);
    }
    .model-info { flex: 1; overflow: hidden; }
    .model-name-text {
      font-size: 13px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .model-id-text {
      font-family: var(--mono); font-size: 9px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
    }
    .chevron { color: var(--muted); font-size: 10px; flex-shrink: 0; }

    #quick-models {
      flex: 1; overflow-y: auto; padding: 6px 10px;
      scrollbar-width: thin; scrollbar-color: var(--border2) transparent;
    }
    .qm-item {
      padding: 8px 11px; border-radius: 9px; cursor: pointer;
      display: flex; align-items: center; gap: 9px;
      transition: background 0.12s; margin-bottom: 2px;
    }
    .qm-item:hover { background: var(--surf2); }
    .qm-item.active {
      background: rgba(124,111,247,0.12);
      border: 1px solid rgba(124,111,247,0.2);
    }
    .qm-name { font-size: 12px; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qm-prov { font-family: var(--mono); font-size: 9px; color: var(--muted); }
    .qm-check { color: var(--accent); font-size: 12px; }

    .sidebar-footer {
      padding: 12px 16px; border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .stream-toggle {
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; font-size: 11px; color: var(--muted);
      user-select: none; transition: color 0.15s;
    }
    .stream-toggle:hover { color: var(--text); }
    .toggle-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green); transition: background 0.2s;
    }
    .toggle-dot.off { background: var(--muted); }
    .icon-btn {
      background: none; border: 1px solid var(--border);
      color: var(--muted); padding: 5px 11px;
      border-radius: 7px; cursor: pointer;
      font-size: 11px; font-family: var(--sans);
      transition: border-color 0.15s, color 0.15s;
    }
    .icon-btn:hover { border-color: var(--border2); color: var(--text); }

    /* ═══════════════ MAIN ═══════════════ */
    #main {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; min-width: 0;
    }

    #chat-header {
      height: 52px; border-bottom: 1px solid var(--border);
      padding: 0 16px; background: var(--surface);
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; flex-shrink: 0;
    }
    #menu-btn {
      display: none;
      background: none; border: none; color: var(--muted);
      font-size: 18px; cursor: pointer; padding: 4px 6px; flex-shrink: 0;
    }
    #chat-title {
      font-family: var(--display); font-size: 14px; font-weight: 700;
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .header-badge {
      font-family: var(--mono); font-size: 9.5px;
      background: rgba(124,111,247,0.12);
      border: 1px solid rgba(124,111,247,0.25);
      color: var(--accent2); padding: 3px 9px; border-radius: 20px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 160px; flex-shrink: 0;
    }

    /* Messages */
    #messages {
      flex: 1; overflow-y: auto;
      padding: 24px 16px;
      display: flex; flex-direction: column; gap: 20px;
      scrollbar-width: thin; scrollbar-color: var(--border2) transparent;
    }

    /* Welcome */
    #welcome {
      margin: auto; text-align: center; max-width: 420px;
      animation: fadeUp 0.35s ease forwards; padding: 20px 0;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .welcome-glyph { font-size: 42px; margin-bottom: 16px; display: block; }
    #welcome h2 {
      font-family: var(--display); font-size: 26px; font-weight: 800;
      letter-spacing: -0.8px; margin-bottom: 8px;
    }
    #welcome p { font-size: 13px; color: var(--muted); line-height: 1.7; }
    .welcome-chips {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 7px; margin-top: 20px;
    }
    .chip {
      padding: 7px 13px; border: 1px solid var(--border2);
      border-radius: 20px; font-size: 12px; color: var(--muted);
      cursor: pointer; transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .chip:hover {
      border-color: var(--accent); color: var(--accent2);
      background: rgba(124,111,247,0.08);
    }

    /* Message rows */
    .msg-row {
      display: flex; gap: 11px; align-items: flex-start;
      animation: fadeUp 0.2s ease forwards;
    }
    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px; height: 28px; border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0; margin-top: 2px;
    }
    .msg-avatar.ai  { background: var(--accent); }
    .msg-avatar.uav { background: var(--surf2); border: 1px solid var(--border2); }

    .msg-bubble {
      max-width: 78%; padding: 11px 14px;
      border-radius: 14px; font-size: 13.5px; line-height: 1.65;
      word-break: break-word;
    }
    .msg-bubble.ai-b {
      background: var(--surf2); border: 1px solid var(--border);
      border-top-left-radius: 4px; color: var(--text);
    }
    .msg-bubble.user-b {
      background: var(--accent); color: #fff; border-top-right-radius: 4px;
    }
    .msg-bubble.err-b {
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.25); color: var(--red);
    }

    .cursor {
      display: inline-block; width: 2px; height: 13px;
      background: var(--accent2); border-radius: 1px;
      margin-left: 2px; vertical-align: middle;
      animation: blink 0.9s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .msg-bubble code {
      font-family: var(--mono); font-size: 12px;
      background: rgba(0,0,0,0.35); padding: 1px 5px;
      border-radius: 4px; color: var(--accent2);
    }
    .msg-bubble pre {
      background: #090910; border: 1px solid var(--border2);
      border-radius: 9px; padding: 12px 14px;
      overflow-x: auto; margin: 8px 0;
      font-family: var(--mono); font-size: 12px; line-height: 1.6; color: #c9d1d9;
    }
    .msg-bubble pre code { background: none; padding: 0; color: inherit; }

    .ldots span {
      display: inline-block; width: 5px; height: 5px;
      border-radius: 50%; background: var(--muted); margin: 0 2px;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .ldots span:nth-child(2) { animation-delay: 0.15s; }
    .ldots span:nth-child(3) { animation-delay: 0.30s; }
    @keyframes bounce {
      0%,60%,100%{ transform:translateY(0); opacity:0.4; }
      30%        { transform:translateY(-5px); opacity:1; }
    }

    /* ═══════════════ INPUT ═══════════════ */
    #input-area {
      padding: 12px 16px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .input-wrap {
      display: flex; align-items: flex-end; gap: 9px;
      background: var(--surf2); border: 1px solid var(--border);
      border-radius: 14px; padding: 9px 9px 9px 14px;
      transition: border-color 0.2s;
    }
    .input-wrap:focus-within { border-color: var(--accent); }

    #user-input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-family: var(--sans);
      font-size: 14px; line-height: 1.5;
      resize: none; max-height: 140px; min-height: 22px;
      overflow-y: auto; scrollbar-width: thin;
    }
    #user-input::placeholder { color: var(--muted); }

    #send-btn {
      width: 36px; height: 36px;
      background: var(--accent); border: none; border-radius: 9px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 15px; flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    #send-btn:hover  { background: #6a5ef0; }
    #send-btn:active { transform: scale(0.93); }
    #send-btn:disabled { background: var(--surf2); color: var(--muted); cursor: not-allowed; }

    .input-meta {
      display: flex; justify-content: space-between;
      padding: 5px 2px 0;
      font-family: var(--mono); font-size: 9.5px; color: var(--muted);
    }

    /* ═══════════════ MODAL ═══════════════ */
    #model-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.72); backdrop-filter: blur(8px);
      z-index: 100; align-items: center; justify-content: center; padding: 16px;
    }
    #model-modal.open { display: flex; }

    .modal-box {
      background: var(--surface); border: 1px solid var(--border2);
      border-radius: 18px; width: 580px; max-width: 100%;
      max-height: 85dvh; max-height: 85vh;
      display: flex; flex-direction: column; overflow: hidden;
      animation: scaleIn 0.18s ease;
    }
    @keyframes scaleIn {
      from { opacity:0; transform:scale(0.96) translateY(6px); }
      to   { opacity:1; transform:scale(1) translateY(0); }
    }
    .modal-header {
      padding: 18px 18px 14px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .modal-header h3 {
      font-family: var(--display); font-size: 16px; font-weight: 700; flex: 1;
    }
    #model-search {
      background: var(--surf2); border: 1px solid var(--border);
      border-radius: 9px; padding: 7px 12px;
      color: var(--text); font-family: var(--sans); font-size: 12.5px;
      outline: none; width: 200px; transition: border-color 0.15s;
    }
    #model-search:focus { border-color: var(--accent); }

    .modal-body {
      flex: 1; overflow-y: auto; padding: 12px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
      align-content: start;
      scrollbar-width: thin; scrollbar-color: var(--border2) transparent;
    }
    .mmc {
      padding: 12px; border: 1px solid var(--border);
      border-radius: 11px; cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .mmc:hover { border-color: var(--accent); background: rgba(124,111,247,0.06); }
    .mmc.active { border-color: var(--accent); background: rgba(124,111,247,0.1); }
    .mmc-name { font-size: 12.5px; font-weight: 600; margin-bottom: 2px; }
    .mmc-prov { font-family: var(--mono); font-size: 9.5px; color: var(--muted); }
    .mmc-id   { font-family: var(--mono); font-size: 9px; color: var(--border2); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mmc-badge {
      float: right; font-size: 9px; font-family: var(--mono);
      padding: 1px 6px; border-radius: 4px;
      background: rgba(74,222,128,0.12); color: var(--green);
      border: 1px solid rgba(74,222,128,0.2);
    }
    .modal-footer {
      padding: 12px 18px; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    #modal-count { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
    .close-btn {
      padding: 7px 18px; background: var(--surf2);
      border: 1px solid var(--border2); border-radius: 8px;
      color: var(--text); font-family: var(--sans); font-size: 12px;
      cursor: pointer; transition: border-color 0.15s;
    }
    .close-btn:hover { border-color: var(--accent); }

    /* ═══════════════ MOBILE OVERLAY ═══════════════ */
    #sidebar-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 19;
    }

    /* ═══════════════ RESPONSIVE ═══════════════ */
    @media (max-width: 640px) {
      #sidebar {
        position: fixed; left: 0; top: 0; bottom: 0;
        transform: translateX(-100%); z-index: 20;
      }
      #sidebar.open { transform: translateX(0); }
      #sidebar-overlay.open { display: block; }

      #menu-btn { display: block; }
      #chat-header { padding: 0 12px; }
      #messages { padding: 14px 12px; }
      #input-area { padding: 10px 12px 12px; }
      .msg-bubble { max-width: 88%; font-size: 13px; }
      .modal-body { grid-template-columns: 1fr; }
      .header-badge { display: none; }
      .input-meta .hint { display: none; }
    }
  </style>
</head>
<body>

<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="sidebar-top">
    <div class="wordmark">
      <div class="wordmark-icon">⚡</div>
      <h1>PuterChat</h1>
      <span class="wordmark-badge">500+ models</span>
    </div>
    <button id="new-chat-btn" onclick="newChat()">＋ New Chat</button>
  </div>

  <div class="section-label">Active Model</div>
  <button id="current-model-btn" onclick="openModal()">
    <span id="cm-icon" style="font-size:17px;flex-shrink:0">🟣</span>
    <div class="model-info">
      <div class="model-name-text" id="cm-name">Claude Sonnet 4.5</div>
      <div class="model-id-text"  id="cm-id">claude-sonnet-4-5</div>
    </div>
    <div class="chevron">▾</div>
  </button>

  <div class="section-label">Quick Switch</div>
  <div id="quick-models"></div>

  <div class="sidebar-footer">
    <div class="stream-toggle" onclick="toggleStream()">
      <div class="toggle-dot" id="stream-dot"></div>
      <span id="stream-label">Streaming ON</span>
    </div>
    <button class="icon-btn" onclick="exportChat()">Export</button>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <div id="chat-header">
    <button id="menu-btn" onclick="openSidebar()">☰</button>
    <div id="chat-title">New Chat</div>
    <span class="header-badge" id="active-badge">claude-sonnet-4-5</span>
  </div>

  <div id="messages"></div>

  <div id="input-area">
    <div class="input-wrap">
      <textarea id="user-input" rows="1" placeholder="Ask anything…"></textarea>
      <button id="send-btn" onclick="sendMessage()">↑</button>
    </div>
    <div class="input-meta">
      <span class="hint">Enter to send · Shift+Enter new line</span>
      <span id="model-hint">claude-sonnet-4-5</span>
    </div>
  </div>
</div>

<!-- MODEL MODAL -->
<div id="model-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Choose a Model</h3>
      <input id="model-search" type="text" placeholder="Search…" oninput="filterModels()" />
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <span id="modal-count">—</span>
      <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════
// STATE
// ════════════════════════════════
let currentModel  = 'claude-sonnet-4-5';
let allModels     = [];
let messages      = [];
let isStreaming   = true;
let isBusy        = false;
let bubbleCounter = 0; // FIX #3 — unique ID per bubble

// ════════════════════════════════
// HARDCODED MODELS — real Puter.js IDs (FIX #2)
// listModels() is a bonus enhancement only
// ════════════════════════════════
const MODELS = [
  { id: 'claude-sonnet-4-5',                  name: 'Claude Sonnet 4.5',    prov: 'Anthropic' },
  { id: 'claude-opus-4-5',                    name: 'Claude Opus 4.5',      prov: 'Anthropic' },
  { id: 'gpt-5-nano',                         name: 'GPT-5 Nano',           prov: 'OpenAI'    },
  { id: 'gpt-5',                              name: 'GPT-5',                prov: 'OpenAI'    },
  { id: 'gpt-4o',                             name: 'GPT-4o',               prov: 'OpenAI'    },
  { id: 'gpt-4o-mini',                        name: 'GPT-4o Mini',          prov: 'OpenAI'    },
  { id: 'gpt-4.1-nano',                       name: 'GPT-4.1 Nano',         prov: 'OpenAI'    },
  { id: 'x-ai/grok-4.20',                     name: 'Grok 4.20',            prov: 'xAI'       },
  { id: 'x-ai/grok-4-1-fast',                 name: 'Grok 4-1 Fast',        prov: 'xAI'       },
  { id: 'x-ai/grok-4',                        name: 'Grok 4',               prov: 'xAI'       },
  { id: 'x-ai/grok-3-mini-beta',              name: 'Grok 3 Mini',          prov: 'xAI'       },
  { id: 'google/gemini-2.5-flash',            name: 'Gemini 2.5 Flash',     prov: 'Google'    },
  { id: 'google/gemini-2.5-pro',              name: 'Gemini 2.5 Pro',       prov: 'Google'    },
  { id: 'deepseek/deepseek-r1',               name: 'DeepSeek R1',          prov: 'DeepSeek'  },
  { id: 'deepseek/deepseek-chat',             name: 'DeepSeek Chat',        prov: 'DeepSeek'  },
  { id: 'meta-llama/llama-3.3-70b-instruct', name: 'Llama 3.3 70B',        prov: 'Meta'      },
  { id: 'meta-llama/llama-3.1-8b-instruct',  name: 'Llama 3.1 8B',         prov: 'Meta'      },
  { id: 'qwen/qwen3-235b-a22b',              name: 'Qwen3 235B',           prov: 'Alibaba'   },
  { id: 'qwen/qwen3-max-thinking',           name: 'Qwen3 Max Thinking',   prov: 'Alibaba'   },
  { id: 'mistralai/mistral-large-latest',    name: 'Mistral Large',        prov: 'Mistral'   },
  { id: 'mistralai/codestral-2508',          name: 'Codestral 2508',       prov: 'Mistral'   },
];

// ════════════════════════════════
// HELPERS
// ════════════════════════════════
const provIcon = id => {
  if (!id) return '🤖';
  const s = id.toLowerCase();
  if (s.includes('claude') || s.includes('anthropic')) return '🟣';
  if (s.includes('gpt') || s.includes('openai') || /^o[0-9]/.test(s)) return '🟢';
  if (s.includes('gemini') || s.includes('google')) return '🔵';
  if (s.includes('grok') || s.includes('x-ai')) return '❌';
  if (s.includes('deepseek')) return '🦋';
  if (s.includes('llama') || s.includes('meta')) return '🦙';
  if (s.includes('mistral') || s.includes('codestral')) return '🌊';
  if (s.includes('qwen')) return '🌸';
  return '🤖';
};

const prettyName = m => m.name || (m.id||m).split('/').pop().replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const provLabel  = m => m.prov || (m.id||'').split('/')[0] || '—';

const escHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function renderMarkdown(text) {
  return text
    .replace(/```(\w*)\n?([\s\S]*?)```/g, (_,l,c) => `<pre><code>${escHtml(c.trim())}</code></pre>`)
    .replace(/`([^`\n]+)`/g, (_,c) => `<code>${escHtml(c)}</code>`)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

// ════════════════════════════════
// INIT
// ════════════════════════════════
async function init() {
  allModels = MODELS; // hardcoded first — always works
  setModel(currentModel);
  renderQuickModels();
  showWelcome();
  setupInput();
  updateStreamUI();

  // Try to load live list as a background enhancement
  try {
    const live = await puter.ai.listModels();
    if (Array.isArray(live) && live.length > 0) {
      allModels = live;
      renderQuickModels();
    }
  } catch (_) { /* silent — hardcoded models are fine */ }
}

// ════════════════════════════════
// MODEL MANAGEMENT
// ════════════════════════════════
function setModel(id) {
  currentModel = id;
  const m = allModels.find(x => (x.id||x) === id) || { id };
  document.getElementById('cm-icon').textContent      = provIcon(id);
  document.getElementById('cm-name').textContent      = prettyName(m);
  document.getElementById('cm-id').textContent        = id;
  document.getElementById('active-badge').textContent = id.split('/').pop();
  document.getElementById('model-hint').textContent   = id;
  renderQuickModels();
}

function renderQuickModels() {
  const el = document.getElementById('quick-models');
  el.innerHTML = '';
  allModels.slice(0, 12).forEach(m => {
    const id = m.id || m;
    const div = document.createElement('div');
    div.className = 'qm-item' + (id === currentModel ? ' active' : '');
    div.innerHTML = `
      <span>${provIcon(id)}</span>
      <span class="qm-name">${prettyName(m)}</span>
      <span class="qm-prov">${provLabel(m)}</span>
      ${id === currentModel ? '<span class="qm-check">✓</span>' : ''}
    `;
    div.onclick = () => { setModel(id); closeSidebar(); };
    el.appendChild(div);
  });
}

// ════════════════════════════════
// MODAL
// ════════════════════════════════
function openModal() {
  renderModalModels();
  document.getElementById('model-modal').classList.add('open');
  setTimeout(() => document.getElementById('model-search').focus(), 50);
}
function closeModal() { document.getElementById('model-modal').classList.remove('open'); }

function renderModalModels(list) {
  const models = list || allModels;
  const body   = document.getElementById('modal-body');
  body.innerHTML = '';
  document.getElementById('modal-count').textContent = `${models.length} models`;
  if (!models.length) {
    body.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">No models found</div>';
    return;
  }
  models.forEach(m => {
    const id = m.id || m;
    const card = document.createElement('div');
    card.className = 'mmc' + (id === currentModel ? ' active' : '');
    card.innerHTML = `
      <div class="mmc-name">${provIcon(id)} ${prettyName(m)} ${id===currentModel?'<span class="mmc-badge">Active</span>':''}</div>
      <div class="mmc-prov">${provLabel(m)}</div>
      <div class="mmc-id">${id}</div>
    `;
    card.onclick = () => { setModel(id); renderModalModels(list); closeModal(); };
    body.appendChild(card);
  });
}

function filterModels() {
  const q = document.getElementById('model-search').value.toLowerCase().trim();
  renderModalModels(q ? allModels.filter(m =>
    (m.id||'').toLowerCase().includes(q) ||
    prettyName(m).toLowerCase().includes(q) ||
    provLabel(m).toLowerCase().includes(q)
  ) : null);
}

// ════════════════════════════════
// SIDEBAR (mobile)
// ════════════════════════════════
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-overlay').classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

// ════════════════════════════════
// CHAT
// ════════════════════════════════
function showWelcome() {
  document.getElementById('messages').innerHTML = `
    <div id="welcome">
      <span class="welcome-glyph">⚡</span>
      <h2>PuterChat</h2>
      <p>Free access to 500+ AI models — Claude, GPT, Grok, Gemini, DeepSeek & more.<br>No API keys. No backend.</p>
      <div class="welcome-chips">
        <div class="chip" onclick="prefill('Explain quantum computing simply')">Quantum computing</div>
        <div class="chip" onclick="prefill('Write a Python web scraper')">Python scraper</div>
        <div class="chip" onclick="prefill('Give me cool developer project ideas')">Project ideas</div>
        <div class="chip" onclick="prefill('Debug this code:\n')">Debug code</div>
        <div class="chip" onclick="prefill('Write a short story about ')">Write a story</div>
      </div>
    </div>
  `;
  document.getElementById('chat-title').textContent = 'New Chat';
}

function prefill(text) {
  const inp = document.getElementById('user-input');
  inp.value = text; inp.focus(); autoResize(inp);
}

function addUserBubble(text) {
  document.getElementById('welcome')?.remove();
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `
    <div class="msg-avatar uav">👤</div>
    <div class="msg-bubble user-b">${escHtml(text).replace(/\n/g,'<br>')}</div>
  `;
  document.getElementById('messages').appendChild(row);
  scrollBottom();
}

// ╔══════════════════════════════════╗
// ║  FIX #3 — unique ID every call  ║
// ╚══════════════════════════════════╝
function addAIBubble() {
  bubbleCounter++;
  const uid = 'bubble-' + bubbleCounter;       // <-- unique per message
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.innerHTML = `
    <div class="msg-avatar ai">${provIcon(currentModel)}</div>
    <div class="msg-bubble ai-b" id="${uid}">
      <span class="ldots"><span></span><span></span><span></span></span>
    </div>
  `;
  document.getElementById('messages').appendChild(row);
  scrollBottom();
  return document.getElementById(uid);          // returns THIS bubble only
}

async function sendMessage() {
  if (isBusy) return;
  const inp  = document.getElementById('user-input');
  const text = inp.value.trim();
  if (!text) return;

  inp.value = '';
  autoResize(inp);
  setBusy(true);

  if (messages.length === 0) {
    const title = text.length > 38 ? text.slice(0, 38) + '…' : text;
    document.getElementById('chat-title').textContent = title;
  }

  addUserBubble(text);
  messages.push({ role: 'user', content: text });

  const bubble = addAIBubble(); // fresh element, fresh ID
  let fullText = '';

  try {
    if (isStreaming) {
      const stream = await puter.ai.chat(messages, { model: currentModel, stream: true });
      bubble.innerHTML = '<span class="cursor"></span>';

      for await (const part of stream) {
        if (part?.text) {
          fullText += part.text;
          bubble.innerHTML = renderMarkdown(fullText) + '<span class="cursor"></span>';
          scrollBottom();
        }
      }
      bubble.innerHTML = renderMarkdown(fullText);

    } else {
      const resp = await puter.ai.chat(messages, { model: currentModel, stream: false });
      fullText = resp?.message?.content ?? (typeof resp === 'string' ? resp : '') || '(empty)';
      bubble.innerHTML = renderMarkdown(fullText);
    }

    messages.push({ role: 'assistant', content: fullText });

  } catch (err) {
    bubble.className = 'msg-bubble err-b';
    bubble.textContent = '❌ ' + (err.message || 'Error — try a different model.');
    console.error(err);
  }

  scrollBottom();
  setBusy(false);
  inp.focus();
}

function scrollBottom() {
  const el = document.getElementById('messages');
  el.scrollTop = el.scrollHeight;
}

// ════════════════════════════════
// CONTROLS
// ════════════════════════════════
function setBusy(v) {
  isBusy = v;
  document.getElementById('send-btn').disabled = v;
}

function newChat() {
  if (messages.length > 0 && !confirm('Start a new conversation?')) return;
  messages = []; bubbleCounter = 0;
  showWelcome(); closeSidebar();
}

function toggleStream() { isStreaming = !isStreaming; updateStreamUI(); }

function updateStreamUI() {
  document.getElementById('stream-dot').className     = 'toggle-dot' + (isStreaming ? '' : ' off');
  document.getElementById('stream-label').textContent = isStreaming ? 'Streaming ON' : 'Streaming OFF';
}

function exportChat() {
  if (!messages.length) { alert('Nothing to export yet.'); return; }
  const blob = new Blob([JSON.stringify(messages, null, 2)], { type: 'application/json' });
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob),
    download: `puterchat-${new Date().toISOString().slice(0,10)}.json`
  });
  a.click();
}

// ════════════════════════════════
// INPUT
// ════════════════════════════════
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

function setupInput() {
  const inp = document.getElementById('user-input');
  inp.addEventListener('input', () => autoResize(inp));
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
}

window.addEventListener('load', init);
</script>
</body>
</html>
